<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private session bus for scripts/test-qml.sh (Phase 17.1.1).

     Same as a stock session bus except it has NO <servicedir>, so nothing
     can be D-Bus-activated on it. Under QT_QUICK_CONTROLS_STYLE=
     org.kde.desktop the controls style asks the settings portal for the
     colour scheme; on a normal session bus that auto-starts
     xdg-desktop-portal-kde, which then outlives the test run, keeps the
     runner's output pipe open and hangs the script (measured 2026-09-26:
     two orphaned portals on /tmp/dbus-* buses). With no activation the
     call fails fast and the style falls back. fakeamp.py is started
     explicitly by the script, not activated, so it is unaffected. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
